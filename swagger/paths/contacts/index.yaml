get:
  tags:
    - Contacts
  summary: Get all contacts
  operationId: getAllContacts
  description: Returns a list of all user contacts
  security:
    - bearerAuth: []
  parameters:
    - name: page
      in: query
      required: false
      schema:
        type: integer
      description: Page number
    - name: limit
      in: query
      required: false
      schema:
        type: integer
      description: Items per page
  responses:
    '200':
      description: A list of contacts
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../../components/schemas/Contact.yaml'

post:
  tags:
    - Contacts
  summary: Create a new contact
  operationId: createContact
  description: Creates a contact
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/Contact.yaml'
  responses:
    '201':
      description: Contact created
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Contact.yaml'
    '400':
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/Error.yaml'
